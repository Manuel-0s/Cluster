    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script>
        const modalFotoEmpleado = document.getElementById('modal-foto-empleado');
        modalFotoEmpleado.addEventListener('show.bs.modal', (event) => {
            const imagen = event.relatedTarget;
            const fotoAmpliada = document.getElementById('foto-empleado-ampliada');
            const titulo = document.getElementById('modal-foto-empleado-titulo');
            const nombre = imagen.getAttribute('data-nombre');

            fotoAmpliada.src = imagen.getAttribute('data-foto');
            fotoAmpliada.alt = `Foto de ${nombre}`;
            titulo.textContent = `Fotografía de ${nombre}`;
        });

        modalFotoEmpleado.addEventListener('hidden.bs.modal', () => {
            document.getElementById('foto-empleado-ampliada').src = '';
        });

        const cargarImagenComoDataUrl = async (ruta) => {
            const respuesta = await fetch(ruta);
            if (!respuesta.ok) {
                throw new Error('No se pudo cargar la fotografía.');
            }

            const blob = await respuesta.blob();
            return new Promise((resolve, reject) => {
                const lector = new FileReader();
                lector.onloadend = () => resolve(lector.result);
                lector.onerror = reject;
                lector.readAsDataURL(blob);
            });
        };

        document.querySelectorAll('.btn-credencial').forEach((boton) => {
            boton.addEventListener('click', async () => {
                const ventana = window.open('', '_blank');
                if (!ventana) {
                    alert('Permite las ventanas emergentes para generar la credencial.');
                    return;
                }

                ventana.document.write('<p style="font-family: sans-serif; padding: 2rem;">Generando credencial...</p>');

                try {
                    const { jsPDF } = window.jspdf;
                    const pdf = new jsPDF({ orientation: 'landscape', unit: 'mm', format: [85.6, 54] });
                    const datos = boton.dataset;
                    const verde = [25, 135, 84];
                    const verdeOscuro = [19, 92, 61];
                    const gris = [90, 99, 105];
                    const blanco = [255, 255, 255];

                    pdf.setFillColor(248, 250, 249);
                    pdf.rect(0, 0, 85.6, 54, 'F');
                    pdf.setFillColor(...verde);
                    pdf.rect(0, 0, 85.6, 14, 'F');
                    pdf.setFillColor(...verdeOscuro);
                    pdf.rect(0, 48, 85.6, 6, 'F');

                    pdf.setDrawColor(...verdeOscuro);
                    pdf.setLineWidth(0.7);
                    pdf.roundedRect(2.5, 2.5, 80.6, 49, 2.5, 2.5);

                    pdf.setTextColor(...blanco);
                    pdf.setFont('helvetica', 'bold');
                    pdf.setFontSize(11);
                    pdf.text('CLUSTER', 7, 7.5);
                    pdf.setFontSize(6);
                    pdf.setFont('helvetica', 'normal');
                    pdf.text('IDENTIFICACIÓN OFICIAL', 7, 11);

                    pdf.setFont('helvetica', 'bold');
                    pdf.setFontSize(7);
                    pdf.text('CREDENCIAL DE EMPLEADO', 78.5, 8.5, { align: 'right' });

                    const fotoX = 7;
                    const fotoY = 19;
                    const fotoAncho = 22;
                    const fotoAlto = 25;
                    pdf.setFillColor(225, 233, 228);
                    pdf.roundedRect(fotoX, fotoY, fotoAncho, fotoAlto, 1.5, 1.5, 'F');

                    if (datos.foto) {
                        const foto = await cargarImagenComoDataUrl(datos.foto);
                        const formatoFoto = foto.startsWith('data:image/png') ? 'PNG' : 'JPEG';
                        pdf.addImage(foto, formatoFoto, fotoX, fotoY, fotoAncho, fotoAlto);
                    } else {
                        pdf.setTextColor(...gris);
                        pdf.setFont('helvetica', 'normal');
                        pdf.setFontSize(6);
                        pdf.text('SIN FOTO', fotoX + fotoAncho / 2, fotoY + 13, { align: 'center' });
                    }

                    pdf.setTextColor(...verdeOscuro);
                    pdf.setFont('helvetica', 'bold');
                    pdf.setFontSize(9);
                    const nombre = pdf.splitTextToSize(datos.nombre, 47);
                    pdf.text(nombre, 34, 20, { lineHeightFactor: 1.15 });

                    const inicioDatos = 20 + (nombre.length * 4.2) + 3;
                    pdf.setTextColor(...gris);
                    pdf.setFontSize(5.5);
                    pdf.setFont('helvetica', 'bold');
                    pdf.text('ID DE EMPLEADO', 34, inicioDatos);
                    pdf.text('RFC', 58, inicioDatos);
                    pdf.setTextColor(35, 40, 42);
                    pdf.setFont('helvetica', 'normal');
                    pdf.setFontSize(7);
                    pdf.text(datos.id, 34, inicioDatos + 4);
                    pdf.text(datos.rfc, 58, inicioDatos + 4);

                    pdf.setTextColor(...gris);
                    pdf.setFont('helvetica', 'bold');
                    pdf.setFontSize(5.5);
                    pdf.text('CORREO ELECTRÓNICO', 34, 39.5);
                    pdf.setTextColor(35, 40, 42);
                    pdf.setFont('helvetica', 'normal');
                    pdf.setFontSize(6.5);
                    pdf.text(datos.correo, 34, 43.5, { maxWidth: 44 });

                    pdf.setTextColor(...blanco);
                    pdf.setFont('helvetica', 'normal');
                    pdf.setFontSize(5.5);
                    pdf.text('Documento de identificación de uso interno', 7, 51.8);
                    ventana.location.href = pdf.output('bloburl');
                } catch (error) {
                    ventana.document.body.innerHTML = '<p style="font-family: sans-serif; padding: 2rem; color: #b02a37;">No fue posible generar la credencial.</p>';
                }
            });
        });
    </script>
